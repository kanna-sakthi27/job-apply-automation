# channels.conf — the channel registry.
#
# One line per channel. This file is the ONLY place a channel is declared: the launcher
# (tools/cron-run.sh) runs whatever prompt you pass it, the pre-flight
# (tools/apply-preflight.sh) reads the log/cap/probe columns from here, and
# tools/install-cron.sh turns the schedule column into crontab lines.
#
# Format (pipe separated, spaces around fields are trimmed):
#
#   name | enabled | schedule | log | daily cap | sites
#
#   name      channel id — must match prompts/<name>.md and <name>-automation/
#   enabled   yes|no — install-cron.sh only schedules `yes` rows
#   schedule  5-field cron spec, or "-" for manual-only channels
#   log       this channel's append-only log; the day-cap counter is
#             "rows dated today marked applied" in this file
#   daily cap max submissions per day for this channel (a hard ceiling)
#   sites     space-separated `name=url` pairs to login-probe before a run.
#             The names must exist in config/probes.conf. "-" disables probing.
#
# A single `*` row is the fallback for any channel that is not listed by name —
# it supplies log/cap/sites only. Prefix a name with nothing special; glob names
# like `foreign-*` are matched with shell case patterns.
#
# Add a channel with:   tools/new-channel.sh <name> --site <url>

# --- channels -----------------------------------------------------------------
linkedin|yes|0 7,12,17 * * *|linkedin-automation/answers.md|30|linkedin=https://www.linkedin.com/feed/
indeed|yes|0 8,13,18 * * *|indeed-automation/answers.md|30|indeed=https://www.indeed.com/
glassdoor|yes|0 6,11,16 * * *|glassdoor-automation/answers.md|30|indeed=https://www.indeed.com/
jaabz|yes|0 9,14,19 * * *|jaabz-automation/answers.md|30|jaabz=https://jaabz.com/ linkedin=https://www.linkedin.com/feed/
foreign-canada|yes|0 10,22 * * *|foreign-jobs-automation/run-log.md|30|indeed=https://ca.indeed.com/ linkedin=https://www.linkedin.com/feed/
foreign-singapore|yes|0 15,21 * * *|foreign-jobs-automation/run-log.md|30|indeed=https://sg.indeed.com/ linkedin=https://www.linkedin.com/feed/
foreign-rotation|yes|0 20,23 * * *|foreign-jobs-automation/run-log.md|30|indeed=https://www.indeed.com/ linkedin=https://www.linkedin.com/feed/

# not scheduled — drives the pipeline self-test, never contacts a job board
selftest|no|-|/dev/null|0|-

# --- fallback for unlisted channels --------------------------------------------
*|-|-|foreign-jobs-automation/run-log.md|30|indeed=https://www.indeed.com/ linkedin=https://www.linkedin.com/feed/
