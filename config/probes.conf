# probes.conf — how the pre-flight decides whether a site session is still logged in.
#
# Format (pipe separated):
#
#   site | in=<signals> | out=<signals>
#
#   signals are `;`-separated substrings, matched case-insensitively against the
#   URL and the first ~1200 chars of visible body text.
#
#   in=<...>   evidence of an AUTHENTICATED session  (e.g. a logged-in nav item)
#   out=<...>  evidence of a SIGNED-OUT page        (e.g. "Sign in")
#   tab=<...>  URL substrings of an already-open tab that prove a real signed-in session.
#              Optional, but strongly recommended: a probe can land on a different country
#              host (indeed.com vs ca.indeed.com) and report "signed out" while the operator
#              is signed in elsewhere. A matching open tab overrides that false negative.
#
# Only an `out=` match blocks a run. No match at all is reported as "unknown" and the
# run proceeds — a false "signed out" is far more expensive than a missed one, because
# it stops applying entirely.
#
# ALSO IMPORTANT: the probe is second-guessed by any of YOUR already-open tabs on that
# site that look authenticated. Job boards serve different auth state per country host
# (indeed.com vs malaysia.indeed.com vs ca.indeed.com), so the probe can land on a host
# where you are signed out while you are perfectly signed in elsewhere.
#
# Add a site by appending a line, then reference it from config/channels.conf.

linkedin|in=My Network;Start a post|out=/login;authwall;/signin;checkpoint|tab=/feed;/mynetwork;/jobs
indeed|in=My Jobs;Sign out|out=Sign in;Log in;/login|tab=/notifications;/myjobs;/account;/settings
jaabz|in=Sign Out;My Profile|out=Sign In;/login|tab=/dashboard;/my-jobs;/profile
